<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-salvar {
            background-color: #4CAF50;
            color: white;
        }
        .btn-salvar:hover {
            background-color: #45a049;
        }
        .btn-cancelar {
            background-color: #999;
            color: white;
        }
        .btn-cancelar:hover {
            background-color: #777;
        }
        .erros {
            background-color: #ffcccc;
            color: #cc0000;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
        .erros.show {
            display: block;
        }
        .erros ul {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>

<body>
    <h1>Editar Livro</h1>

    {% if erros %}
        <div class="erros show">
            <ul>
                {% for erro in erros %}
                    <li>{{ erro }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo" value="{{ livro.titulo }}" required>
        </div>

        <div class="form-group">
            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor" value="{{ livro.autor }}" required>
        </div>

        <div class="form-group">
            <label for="ano">Ano de Publicação:</label>
            <input type="number" id="ano" name="ano" value="{{ livro.ano }}" required>
        </div>

        <div class="form-group">
            <label for="categoria">Categoria:</label>
            <input type="text" id="categoria" name="categoria" value="{{ livro.categoria }}" required>
        </div>

        <div class="form-group">
            <label for="quantidade">Quantidade de Exemplares:</label>
            <input type="number" id="quantidade" name="quantidade" value="{{ livro.quantidade }}" min="1" required>
        </div>

        <div class="botoes">
            <button type="submit" class="btn-salvar">Salvar Alterações</button>
            <a href="{{ url_for('listar') }}" style="flex: 1; display: flex; align-items: center; justify-content: center;">
                <button type="button" class="btn-cancelar">Cancelar</button>
            </a>
        </div>
    </form>
</body>

</html>
