<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>cadastro de usuário</h2>
  {% with mensagens = get_flashed_messages(with_ctegories=true) %}
     {% if mensagens %}
        {% for categoria, mensagem in mensagens}
        <p>
            <strong>{{ categoria }}:</strong> {{mensagem}}
        </p>
      {% endfor %}
    {% endif %}
   {% endwith %}

   <form action="{{ url_for('cadastro') }}" method="POST">
     <label>nome:</label>
     <input type="text" name="nome">

     <label>E-mail:</label>
     <input type="email" name="email">
     
     <button type="submit">cadastrar</button>

   </form>

   <style>

     .erro{
        background-color: #ffb3b3;
        color: darkred;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        width: 300px;
     }
      
      .sucesso{
        background-color: #b6ffb3;
        color: darkgreen;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        width: 300px;
     }





   </style>

</body>
</html>
