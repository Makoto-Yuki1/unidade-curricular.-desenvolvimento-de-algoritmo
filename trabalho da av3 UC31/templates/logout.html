<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Logout — Cantina</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <style>
      /* pequeno ajuste para centralizar o conteúdo da página de logout */
      .logout-box{
        max-width: 600px;
        margin: 80px auto;
        padding: 24px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,.08);
        text-align: center;
      }
      .logout-actions{
        margin-top: 20px;
        display:flex;
        gap:12px;
        justify-content:center;
      }
    </style>
</head>
<body>
  <div class="container">
    <div class="logout-box">
      <h1>Você deseja sair?</h1>
      {% if username %}
        <p>Usuário atual: <strong>{{ username }}</strong></p>
      {% endif %}
      <p>Ao confirmar, você será desconectado da sessão.</p>

      <div class="logout-actions">
        <!-- botão que aciona a rota de logout existente -->
        <form action="{{ url_for('logout') }}" method="GET" style="display:inline;">
          <button type="submit" class="zerar">Sair</button>
        </form>

        <!-- cancelar volta para o cardápio -->
        <a href="{{ url_for('cardapio') }}">
          <button type="button">Cancelar</button>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
