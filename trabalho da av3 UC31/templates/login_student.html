<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar - CantinaTech</title>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title mb-3">Identifique-se</h4>
              {% if message %}
                <div class="alert alert-danger">{{ message }}</div>
              {% endif %}
              <form method="POST" action="/entrar">
                <div class="mb-3">
                  <label for="nome" class="form-label">Nome do Aluno</label>
                  <input id="nome" name="nome" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="turma" class="form-label">Turma</label>
                  <input id="turma" name="turma" class="form-control" />
                </div>
                <div class="d-flex justify-content-between">
                  <a href="/" class="btn btn-secondary">Voltar</a>
                  <button class="btn btn-danger" type="submit">Entrar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
